<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico">
    <title>¡Feliz Cumpleaños Angie!</title>
    <!-- Tailwind CSS para el diseño responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Dancing+Script:wght@600;700&display=swap');

        body {
            font-family: 'Comic Neue', cursive, sans-serif;
            overflow-x: hidden;
            /* Fondo inicial negro */
            background-color: #000000;
            transition: background 1s ease;
        }

        /* -------------------------------------------------------------
           ESTILOS DEL SOBRE INICIAL Y TROLL BUTTON (ROJOS OSCUROS)
        ------------------------------------------------------------- */
        .envelope-wrapper {
            perspective: 1000px;
        }

        .envelope {
            position: relative;
            width: 320px;
            height: 220px;
            background-color: #881337; /* Rojo borgoña / vino oscuro */
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.6), 0 10px 10px rgba(0, 0, 0, 0.4);
            transition: transform 0.6s ease;
        }

        @media (min-width: 640px) {
            .envelope {
                width: 420px;
                height: 280px;
            }
        }

        /* Top Flap */
        .envelope .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-top: 130px solid #4c0519; /* Vino muy oscuro */
            transform-origin: top;
            transition: transform 0.8s ease, z-index 0.2s ease;
            z-index: 5;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.3));
        }

        @media (min-width: 640px) {
            .envelope .flap {
                border-left: 210px solid transparent;
                border-right: 210px solid transparent;
                border-top: 170px solid #4c0519;
            }
        }

        /* Envelope Inner Pocket Side Folds */
        .envelope .pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid #9f1239;
            border-right: 160px solid #881337;
            border-bottom: 120px solid #4c0519;
            border-top: 100px solid transparent;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            z-index: 4;
        }

        @media (min-width: 640px) {
            .envelope .pocket {
                border-left: 210px solid #9f1239;
                border-right: 210px solid #881337;
                border-bottom: 150px solid #4c0519;
                border-top: 130px solid transparent;
            }
        }

        /* TEXTO EN LA PARTE INFERIOR IZQUIERDA DEL SOBRE */
        .envelope-text {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10;
            text-align: left;
            pointer-events: none;
            color: #ffffff;
            text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.6);
            transition: opacity 0.4s ease;
        }

        @media (min-width: 640px) {
            .envelope-text {
                bottom: 25px;
                left: 30px;
            }
        }

        .envelope.open .envelope-text {
            opacity: 0;
        }

        /* Wax Seal Stamp (Perfectamente centrado) */
        .wax-seal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 65px;
            height: 65px;
            background: radial-gradient(circle, #e11d48 0%, #881337 100%);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #ffffff;
            font-size: 13px;
            font-weight: bold;
            line-height: 1.1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.2);
            z-index: 15;
            cursor: pointer;
            transition: transform 0.3s ease, opacity 0.4s ease;
        }

        @media (min-width: 640px) {
            .wax-seal {
                width: 75px;
                height: 75px;
                font-size: 15px;
            }
        }

        .envelope.open .flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .envelope.open .wax-seal {
            opacity: 0;
            pointer-events: none;
        }

        #btn-no {
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: absolute;
            z-index: 50;
        }

        /* -------------------------------------------------------------
           1. TARJETA PRINCIPAL
        ------------------------------------------------------------- */
        .card-strawberry-bg {
            background-color: #2a080c; 
            background-image: url('fresita.png');
            background-repeat: repeat;
            background-size: 55px 55px;
            animation: shakePattern 1.2s infinite ease-in-out;
        }

        /* -------------------------------------------------------------
           2. PANTALLA FINAL
        ------------------------------------------------------------- */
        .final-page-bg {
            background-color: #dbeafe; 
        }

        .card-blueberry-bg {
            background-color: #e0e7ff;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60"><text x="15" y="38" font-size="28">🫐</text></svg>');
            background-repeat: repeat;
            background-size: 55px 55px;
            animation: shakePattern 1.5s infinite ease-in-out;
        }

        @keyframes shakePattern {
            0% { background-position: 0px 0px; }
            25% { background-position: -3px 3px; }
            50% { background-position: 3px -3px; }
            75% { background-position: -2px -2px; }
            100% { background-position: 0px 0px; }
        }

@keyframes fallMissile {
    0% { transform: translateY(-120vh) scale(0.7) rotate(10deg); opacity: 1; }
    80% { transform: translateY(0vh) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translateY(30px) scale(3) rotate(0deg); opacity: 1; }
}

.missile-anim {
    /* Mantenemos tu animación original */
    animation: fallMissile 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    
    /* Nuevos estilos para la imagen */
    width: 60px; /* Ajusta el ancho según lo que necesites */
    height: auto; /* Mantiene la proporción de la imagen */
    object-fit: contain;
    position: absolute; /* Asegúrate de que tenga posicionamiento para que caiga bien */
    /* top: ...; left: ...; */
}

@keyframes explosionFlash {
    0% { transform: scale(0); opacity: 0; }
    50% { transform: scale(1.5); opacity: 0.9; background-color: #3b82f6; }
    100% { transform: scale(35); opacity: 1; background-color: #ffffff; }
}

.explosion-circle {
    animation: explosionFlash 0.7s ease-out forwards;
}

        @keyframes violentShake {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-12px, 8px); }
            40% { transform: translate(12px, -8px); }
            60% { transform: translate(-8px, -12px); }
            80% { transform: translate(8px, 12px); }
            100% { transform: translate(0, 0); }
        }

        .shake-hard {
            animation: violentShake 0.3s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 relative">

    <!-- PANTALLA INICIAL: SOBRE TROLL -->
    <div id="envelope-screen" class="flex flex-col items-center justify-center w-full max-w-xl z-20 transition-all duration-700">

        <!-- Envelope Wrapper -->
        <div class="envelope-wrapper mb-8 flex justify-center items-center w-full">
            <div id="envelope" class="envelope">
                
                <!-- TEXTO EN LA PARTE INFERIOR DEL SOBRE -->
                <div class="envelope-text">
                    <p class="text-lg md:text-xl font-bold tracking-wide">De: Jon</p>
                    <p class="text-lg md:text-xl font-bold tracking-wide">Para: Angie</p>
                </div>

                <div class="flap"></div>
                <div class="wax-seal" onclick="openEnvelope()">
                    <span>Abrir</span>
                    <span style="font-size: 11px; opacity: 0.9;">&gt;w&lt;</span>
                </div>
                <div class="pocket"></div>
            </div>
        </div>

        <!-- Botón Troll con estilo oscuro y elegante -->
        <div id="envelope-buttons" class="relative w-full h-20 flex items-center justify-center gap-6 z-30">
            <button id="btn-no" onmouseover="teleportButton(this)" onclick="teleportButton(this)" ontouchstart="teleportButton(this)" class="px-6 py-3.5 bg-[#1a0509]/90 text-rose-200 font-bold text-lg rounded-2xl shadow-md border-2 border-rose-900 hover:bg-[#2a080c] flex items-center gap-2 cursor-pointer">
                <span>No quelo 😡</span>
            </button>
        </div>
    </div>

    <!-- TARJETA PRINCIPAL DE ANGIE -->
    <div id="main-container" class="card-strawberry-bg w-full max-w-md rounded-3xl shadow-2xl p-6 md:p-8 flex-col items-center border-4 border-rose-900 relative overflow-hidden transition-all duration-500 hidden z-10">
        
        <div class="flex flex-row items-center justify-center gap-4 w-full mb-6">
            <img src="FresitaG.png" alt="Fresita Gato" class="w-28 h-28 md:w-32 md:h-32 object-contain" onerror="this.src='https://placehold.co/128x128/fda4af/ffffff?text=FresitaG'">
            <span class="text-pink-100 font-bold text-lg md:text-xl text-center px-2">
                Feliz cumpleaños Angie:3
            </span>
            <img src="MoritaG.png" alt="Morita Gato" class="w-28 h-28 md:w-32 md:h-32 object-contain" onerror="this.src='https://placehold.co/128x128/93c5fd/ffffff?text=MoritaG'">
        </div>

        <p class="text-pink-200 text-base md:text-lg font-bold mb-6 text-center bg-black/40 px-5 py-1.5 rounded-full shadow-sm border border-rose-900">
            te prepare una sorpresita :3
        </p>

        <button id="surprise-btn" onclick="triggerDestruction()" class="w-full bg-gradient-to-r from-rose-700 to-red-800 hover:from-rose-600 hover:to-red-700 text-white font-bold text-lg md:text-xl py-3.5 px-6 rounded-2xl shadow-md border-2 border-white/30 transform transition hover:scale-105 active:scale-95 cursor-pointer">
            Presiona aqui jsjsj
        </button>
    </div>

    <!-- Contenedor del Misil -->
    <div id="missile-container" class="fixed inset-0 pointer-events-none z-50 flex items-center justify-center hidden">
        <img id="missile-img" src="misil.png" alt="Misil" class="w-32 h-64 object-contain missile-anim">
    </div>

    <!-- Capa de Destello de Explosión -->
    <div id="explosion-overlay" class="fixed inset-0 pointer-events-none z-40 flex items-center justify-center hidden">
        <div class="w-20 h-20 rounded-full explosion-circle"></div>
    </div>

    <!-- Pantalla Final / Video -->
    <div id="screen-white" class="fixed inset-0 bg-white z-50 hidden flex flex-col items-center justify-center">
        <video id="surprise-video" class="w-full h-full object-cover hidden" controls playsinline>
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            Tu navegador no soporta reproducción de video.
        </video>

        <div id="final-screen" class="fixed inset-0 card-blueberry-bg hidden flex flex-col items-center justify-center p-6 text-center">
            <div class="bg-[#e0e7ff] border-4 border-blue-200 rounded-3xl p-6 md:p-8 max-w-md shadow-2xl relative overflow-hidden flex flex-col items-center">
                <h2 class="text-3xl md:text-4xl font-bold text-blue-600 mb-4">
                    ¡Feliz Cumpleaños Angie!
                </h2>
                <p class="text-lg md:text-xl text-blue-900 leading-relaxed font-bold">
                    ¡Espero que te haya encantado tu sorpresita! Que tengas un día muy hermoso. 🎉❤️
                </p>
                <button onclick="location.reload();" class="mt-6 bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transition transform hover:scale-105 cursor-pointer">
                    Volver a ver 🔄
                </button>
            </div>
        </div>
    </div>

    <!-- Mensaje Troll Toast con fondo vino oscuro y texto claro -->
    <div id="troll-toast" class="fixed bottom-6 bg-[#1a0509]/95 backdrop-blur-md border border-rose-900 text-rose-200 px-5 py-2.5 rounded-full shadow-lg text-sm font-bold pointer-events-none opacity-0 transition-opacity duration-300 z-50 flex items-center gap-2">
        <span>Abrelo andale 🥺👉🏻👈🏻</span>
    </div>

    <script>
        function teleportButton(btn) {
            const padding = 20;
            const btnWidth = btn.offsetWidth || 120;
            const btnHeight = btn.offsetHeight || 45;

            const maxX = window.innerWidth - btnWidth - padding;
            const maxY = window.innerHeight - btnHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            btn.style.position = 'fixed';
            btn.style.left = `${randomX}px`;
            btn.style.top = `${randomY}px`;

            const toast = document.getElementById('troll-toast');
            toast.style.opacity = '1';
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => {
                toast.style.opacity = '0';
            }, 1500);
        }

        function openEnvelope() {
            const envelope = document.getElementById('envelope');
            const envelopeScreen = document.getElementById('envelope-screen');
            const mainContainer = document.getElementById('main-container');

            envelope.classList.add('open');

            document.body.style.background = 'linear-gradient(-45deg, #1a0509, #330a11, #4c0f1a, #2a080c)';

            setTimeout(() => {
                envelopeScreen.classList.add('opacity-0', 'scale-95');
                
                setTimeout(() => {
                    envelopeScreen.classList.add('hidden');
                    mainContainer.classList.remove('hidden');
                    mainContainer.classList.add('flex');
                }, 500);
            }, 700);
        }

        function triggerDestruction() {
            const btn = document.getElementById('surprise-btn');
            const mainContainer = document.getElementById('main-container');
            const missileContainer = document.getElementById('missile-container');
            const explosionOverlay = document.getElementById('explosion-overlay');
            
            btn.disabled = true;

            mainContainer.classList.add('shake-hard');

            setTimeout(() => {
                missileContainer.classList.remove('hidden');
            }, 300);

            setTimeout(() => {
                explosionOverlay.classList.remove('hidden');
            }, 1500);

            setTimeout(() => {
                const whiteScreen = document.getElementById('screen-white');
                const videoEl = document.getElementById('surprise-video');

                whiteScreen.classList.remove('hidden');
                videoEl.classList.remove('hidden');

                videoEl.play().catch(error => {
                    console.log("El navegador requiere reproducción manual de video.", error);
                });

                videoEl.onended = function() {
                    videoEl.classList.add('hidden');
                    document.getElementById('final-screen').classList.remove('hidden');
                };

            }, 2000);
        }
    </script>
</body>
</html>
